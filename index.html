<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTrack!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <div class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9z"/>
      </svg>
    </div>
    <div class="brand">Fit<em>Track</em></div>
    <div class="header-sub">Your personal workout log</div>
  </header>

  <main class="main">

    <!-- FORM -->
    <div class="form-card">
      <p class="section-label">Log a session</p>

      <div class="field">
        <label for="sport-sel">Sport</label>
        <div class="select-wrap">
          <select id="sport-sel">
            <option value="running">Running</option>
            <option value="lifting">Lifting</option>
            <option value="yoga">Yoga</option>
            <option value="football">Football</option>
          </select>
        </div>
        <div class="sport-pill" id="sport-pill">
          <div class="sport-pill-dot" id="pill-dot"></div>
          <span id="pill-text"></span>
        </div>
      </div>

      <div class="field">
        <label>Rating</label>
        <div class="stars" id="stars">
          <button class="star-btn" data-n="1" aria-label="1 star">★</button>
          <button class="star-btn" data-n="2" aria-label="2 stars">★</button>
          <button class="star-btn" data-n="3" aria-label="3 stars">★</button>
          <button class="star-btn" data-n="4" aria-label="4 stars">★</button>
          <button class="star-btn" data-n="5" aria-label="5 stars">★</button>
        </div>
        <div class="mood-text" id="mood-text"></div>
      </div>

      <div class="field">
        <label for="date-in">Date</label>
        <input type="date" id="date-in" />
      </div>

      <div class="form-err" id="form-err"></div>
      <button class="submit-btn" id="submit-btn">Add workout</button>
    </div>

    <!-- HISTORY -->
    <section aria-label="Session history">
      <div class="history-head">
        <span class="section-label" style="margin-bottom:0">Session history</span>
        <span class="history-count" id="hist-count"></span>
      </div>
      <div class="empty" id="empty-state">
        <div class="empty-glyph">🏃</div>
        <div class="empty-title">No sessions logged yet</div>
        <div class="empty-hint">Add your first workout using the form.</div>
      </div>
      <div class="entries" id="entries" style="display:none"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
