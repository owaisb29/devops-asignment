<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack — Workout Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ── Header ── -->
    <header>
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🏋️</span>
                <h1>FitTrack</h1>
            </div>
            <p class="tagline">Your personal workout log</p>
        </div>
    </header>

    <main class="container">

        <!-- ── Stats Bar ── -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-number" id="stat-total">0</span>
                <span class="stat-label">Total Workouts</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-week">0</span>
                <span class="stat-label">This Week</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-avg">—</span>
                <span class="stat-label">Avg Rating</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="stat-mins">0</span>
                <span class="stat-label">Total Mins</span>
            </div>
        </section>

        <!-- ── Entry Form ── -->
        <section class="form-card">
            <h2 class="section-title">📝 Log a Workout</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="input-type">Workout Type</label>
                    <select id="input-type">
                        <option value="Running">🏃 Running</option>
                        <option value="Weightlifting">🏋️ Weightlifting</option>
                        <option value="Yoga">🧘 Yoga</option>
                        <option value="HIIT">🔥 HIIT</option>
                        <option value="Football">⚽ Football</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-date">Date</label>
                    <input type="date" id="input-date">
                </div>

                <div class="form-group">
                    <label for="input-duration">Duration (minutes)</label>
                    <input type="number" id="input-duration" min="1" max="999" placeholder="e.g. 45">
                </div>

                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-row" id="star-row">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="input-notes">Notes (optional)</label>
                    <textarea id="input-notes" placeholder="How did it feel? Any personal bests?"></textarea>
                </div>

            </div>

            <button class="btn-add" id="btn-add">+ Add Entry</button>
        </section>

        <!-- ── Workout Log ── -->
        <section class="log-section">
            <h2 class="section-title">📋 Workout Log</h2>
            <div class="workout-list" id="workout-list"></div>
        </section>

    </main>


    <script src="script.js"></script>
</body>
</html>
